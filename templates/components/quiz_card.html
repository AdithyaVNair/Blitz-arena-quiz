<div class="card quiz-card">
  <div class="card-header">
    <h3 class="card-title">{{ quiz.title }}</h3>
    {% if quiz.topic %}
      <span class="badge">{{ quiz.topic }}</span>
    {% endif %}
  </div>
  <p class="card-subtitle">{{ quiz.questions.count }} Questions &bull; Created by {{ quiz.owner.username }}</p>
  <div class="card-actions">
    <a href="/rooms/create/{{ quiz.id }}/" class="btn btn-primary btn-sm">Host Game</a>
  </div>
</div>
